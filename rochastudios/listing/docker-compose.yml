services:
  rochastudios-listing:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rochastudios/listing:latest
    container_name: rochastudios-listing
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    environment:
      # Set to your real subdomain on OutstandingRealtor.com for auto-TLS
      # e.g. HOST=listing.outstandingrealtor.com
      HOST: ${HOST:-localhost}
    volumes:
      # Caddy stores TLS certs + config here — persist across restarts
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.rochastudios.app=listing"
      - "com.rochastudios.site=outstandingrealtor.com"

volumes:
  caddy_data:
  caddy_config:
